services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: "sqlite:////data/linxiaodai.db"
    volumes:
      - linxiaodai_data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: "http://localhost:8000"
    depends_on:
      - api
    ports:
      - "5173:4173"

volumes:
  linxiaodai_data:
